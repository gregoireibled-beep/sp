name: Compilation du projet SPC

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v3

    - name: Installer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installer les dépendances nécessaires
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors openpyxl pyinstaller

    - name: Compiler le script Python en EXE
      run: |
        pyinstaller --onedir --noconsole --clean serveur_spc_V4.py

    - name: Créer l'archive ZIP complète du projet
      shell: powershell
      run: |
        # 1. Crée le dossier temporaire de release
        New-Item -ItemType Directory -Force -Path spc_release

        # 2. Copie l'intégralité du dossier généré par PyInstaller (indispensable en mode --onedir)
        if (Test-Path "dist\serveur_spc_V4") {
            Copy-Item -Path "dist\serveur_spc_V4\*" -Destination "spc_release\" -Recurse -Force
        }

        # 3. Recherche et copie des fichiers de l'interface HTML/JS
        Get-ChildItem -Recurse -Include "*spc.html", "*articles.js" | ForEach-Object {
            # On s'assure de ne pas copier des doublons déjà présents dans les dossiers de build
            if ($_.FullName -notlike "*spc_release*" -and $_.FullName -notlike "*dist*" -and $_.FullName -notlike "*build*") {
                Copy-Item -Path $_.FullName -Destination "spc_release\" -Force
                Write-Host "Fichier d'interface copié : $($_.Name)"
            }
        }

        # 4. Compression du dossier en fichier ZIP
        Compress-Archive -Path spc_release\* -DestinationPath Application_SPC.zip -Force
        Write-Host "Fichier ZIP créé avec succès."

    - name: Mettre à disposition le fichier ZIP (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Application_SPC_Windows
        path: Application_SPC.zip
        retention-days: 7
